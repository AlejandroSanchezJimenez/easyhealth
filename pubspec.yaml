name: deporte_salud
description: App de ejercicio enfocada en enfermedades. Firebase como fuente principal; modo emergencia sin conexión.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.2.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  dio: ^5.5.0
  connectivity_plus: ^6.0.5
  uuid: ^4.4.2
  video_player: ^2.9.1
  flutter_launcher_icons: ^0.14.4
  file_picker: ^8.0.0
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  google_mobile_ads: ^6.0.0 #Paquete para añadir anuncios
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.jpg"
  web:
    generate: true
    image_path: "assets/icon.jpg"